name: PPA

on:
  workflow_dispatch:
  # Re-enable once the PPA exists at https://launchpad.net/~daiwj2024/+ppas
  # and the LAUNCHPAD_SSH_PRIVATE_KEY secret is set:
  # push:
  #   tags: ["v*"]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the Linux binaries the package ships
        run: go tool mygo build -platform linux/amd64,linux/arm64
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends debhelper devscripts
      - name: Build the source package
        run: dpkg-buildpackage -S -d -us -uc
      - name: Upload to the Launchpad PPA
        env:
          LAUNCHPAD_SSH_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_SSH_PRIVATE_KEY }}
        run: |
          set -ex
          mkdir -p ~/.ssh
          printf '%s\n' "$LAUNCHPAD_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for i in 1 2 3; do
            ssh-keyscan -T 10 -p 2222 ppa.launchpad.net >> ~/.ssh/known_hosts && break
            sleep 5
          done
          grep -q "ppa.launchpad.net" ~/.ssh/known_hosts
          version=$(jq -r .version mygo.json)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "v$version" = "$GITHUB_REF_NAME" || {
              echo "tag $GITHUB_REF_NAME does not match version $version" >&2
              exit 1
            }
          fi
          ls -la ..
          dput -f ppa:daiwj2024/ppa "../fangqiezhong_${version}_source.changes"
