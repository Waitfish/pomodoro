name: PPA

on:
  # Manual: run this after each release to push the signed source package
  # to the PPA (https://launchpad.net/~daiwj2024/+archive/ubuntu/ppa).
  # A tag trigger would re-upload an existing version and be rejected.
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the Linux binaries the package ships
        run: go tool mygo build -platform linux/amd64,linux/arm64
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends debhelper dput python3-paramiko
      - name: Build the source package
        env:
          LAUNCHPAD_GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}
        run: |
          # Launchpad's queue identifies the uploader by the GPG signature
          # on .changes/.dsc and mails the verdict; unsigned uploads are
          # silently dropped. The key's email must match the Launchpad
          # account's verified email.
          printf '%s\n' "$LAUNCHPAD_GPG_PRIVATE_KEY" | gpg --batch --import
          dpkg-buildpackage -S -d -k8A274FB7745E4274CA84D1F9E36EBF9ACA024BA7
      - name: Upload to the Launchpad PPA
        env:
          LAUNCHPAD_SSH_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_SSH_PRIVATE_KEY }}
        run: |
          set -ex
          mkdir -p ~/.ssh
          printf '%s\n' "$LAUNCHPAD_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Launchpad PPA uploads speak SSH/SFTP on port 22 (2222 is for git).
          # The built-in dput "ppa:" profile uses plain FTP, which has been
          # unreliable since mid-2026 (Launchpad bug 2158204); use sftp.
          for i in 1 2 3; do
            ssh-keyscan -4 -T 10 ppa.launchpad.net >> ~/.ssh/known_hosts && break
            sleep 5
          done
          grep -q "ppa.launchpad.net" ~/.ssh/known_hosts
          cat > ~/.dput.cf <<'EOF'
          [lp-sftp]
          fqdn = ppa.launchpad.net
          method = sftp
          incoming = ~daiwj2024/ubuntu/%(lp-sftp)s
          login = daiwj2024
          allow_unsigned_uploads = 1
          EOF
          version=$(jq -r .version mygo.json)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "v$version" = "$GITHUB_REF_NAME" || {
              echo "tag $GITHUB_REF_NAME does not match version $version" >&2
              exit 1
            }
          fi
          # A rejected or still-queued earlier upload makes this fail with
          # the queue's own words; keep going to the verification step.
          dput -f lp-sftp:ppa "../fangqiezhong_${version}_source.changes" || true
      - name: Verify the publication
        run: |
          for i in $(seq 1 20); do
            sleep 30
            body=$(curl -sL --max-time 30 "https://launchpad.net/~daiwj2024/+archive/ubuntu/ppa/+packages" || true)
            if printf '%s' "$body" | grep -qi fangqiezhong; then
              echo "the package is in the PPA; builds are running"
              exit 0
            fi
            echo "attempt $i: not published yet"
          done
          echo "the package did not appear within 10 minutes" >&2
          exit 1
